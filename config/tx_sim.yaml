host: localhost
plugin_path: ""
setup: 
    - ~/.genom_env.sh
    - /opt/ros/humble/setup.bash
    - ~/work/ws_livox/ros2/install/setup.bash
    
mass: 2.765
geom:
    rotors: 6
    armlen: 0.39
    cf: 12.5e-4
    ct: 2.5e-5
    rx: -20
    rz: -1

components:
    rotorcraft:
        type: rotorcraft
        serial: /tmp/pty-tx
        calib: ""

    mocap:
        type: optitrack
        host: localhost
        port: "1509"

    pom:
        type: pom
        meas:
            -
                name: mocap
                port: mocap/bodies/TX
            -
                name: imu
                port: rotorcraft/imu

    pom_lidar:
        type: pom
        meas:
            -
                name: lidar
                port: ros2/lio
            -
                name: imu
                port: rotorcraft/imu
                offset: [0, 0, -0.05, 0, 0, 0]

    uavpos:
        type: uavpos
        xyradius: 1
        gain:
            Kpxy: 10
            Kpz: 10
            Kvxy: 20
            Kvz: 20
            Kixy: 0
            Kiz: 0

    uavatt:
        type: uavatt
        gain:
            Kqxy: 15
            Kqz: 15
            Kwxy: 3
            Kwz: 1

    maneuver:
        type: maneuver
        vmax: 3
        wmax: 3
        amax: 4
        dwmax: 4

external_publishers:
    lidar:
        target: pom_lidar
        publisher: measure
        port: ros2/lio

sidecars:
    lio_relay: python3 scripts/lio_relay.py tilthex_simu
    rviz_bridge: python3 scripts/rviz_bridge.py tilthex_simu 20

ros2:
    enabled: true
    domain_id: 42
    launchfiles:
        - launch_lio_gz.py
