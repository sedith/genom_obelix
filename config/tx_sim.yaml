host: localhost
plugin_path: ""
setup: 
    - ~/.genom_env.sh
    - /opt/ros/humble/setup.bash
    - ~/work/ws_livox/ros2/install/setup.bash
    
inertial:
    mass: 3.185
    Jxx: 0.0115
    Jyy: 0.0115
    Jzz: 0.0194

geom:
    rotors: 6
    armlen: 0.39
    cf: 11.4e-4
    ct: 2.4e-5
    rx: -20
    rz: -1

gz:
    world: tilthex_lidar.world
    options: -s -r

components:
    rotorcraft:
        type: rotorcraft
        serial: /tmp/pty-tx
        calib: ""

    mocap:
        type: optitrack
        host: localhost
        port: "1509"

    pom_mocap:
        type: pom
        meas:
            -
                name: mocap
                port: mocap/bodies/tx
            -
                name: imu
                port: rotorcraft/imu
                offset: [0, 0, -0.075, 0, 0, 0]

    pom:
        type: pom
        meas:
            -
                name: lidar
                port: ros2/lio
            -
                name: imu
                port: rotorcraft/imu
                offset: [0, 0, -0.075, 0, 0, 0]

    uavpos:
        type: uavpos
        reference: phynt/desired
        xyradius: 2
        gain:
            Kpxy: 10
            Kpz: 10
            Kvxy: 20
            Kvz: 20
            Kixy: 0
            Kiz: 0

    uavatt:
        type: uavatt
        gain:
            Kqxy: 15
            Kqz: 15
            Kwxy: 3
            Kwz: 1

    maneuver:
        type: maneuver
        vmax: 3
        wmax: 3
        amax: 4
        dwmax: 4

    phynt:
        type: phynt
        wo:
            K: [10.0, 10.0, 10.0, 2.0, 2.0, 2.0]
            fc: [20, 20, 20, 0, 0, 0]
            thresh: [0, 0, 0, 0, 0, 0]
            bias: [0, 0, 0, 0, 0, 0]
        af:
            K: [10, 10, 10, 100, 100, 100]

external_publishers:
    lidar:
        target: pom
        publisher: measure
        port: ros2/lio

sidecars:
    lio_relay: python3 scripts/lio_relay.py tx_sim /mimosa/odometry
    rviz_bridge: python3 scripts/rviz_bridge.py tx_sim 20
    rviz: rviz2 -d ros2/config/rviz_livox.rviz > /dev/null 2>&1

ros2:
    enabled: true
    domain_id: 42
    launchfiles:
        - launch_mimosa_gz.py
    bag:
        - /mimosa/odometry
        - /mimosa/odometry_imufreq
        - /mimosa/local_map
        - /tf
        - /tf_static
        - /livox/lidar
        - /livox/imu
        - /genom/pom/odometry
        - /genom/pom_mocap/odometry
        - /genom/maneuver/desired
        - /genom/phynt/desired
